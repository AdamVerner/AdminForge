name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet build AdminForge.slnx -c Release
      - run: dotnet test AdminForge.slnx -c Release --no-build

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      # Read in the step conditions below; the secrets context is not available in `if`.
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The tag is the version: v0.0.1 packs 0.0.1, overriding the csproj default.
      - name: Pack
        run: dotnet pack src/AdminForge/AdminForge.csproj -c Release -p:Version="${GITHUB_REF_NAME#v}" -o nupkg

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push 'nupkg/*.nupkg' --skip-duplicate
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

      # Trusted publishing: trades this job's OIDC token for a key valid one hour, so it
      # has to sit immediately before the push. Skipped until NUGET_USER is set.
      - name: Log in to nuget.org
        id: nuget-login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.NUGET_USER != ''
        run: >
          dotnet nuget push 'nupkg/*.nupkg' --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
